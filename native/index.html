<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <title>Voltair Portal</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f4;
        font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ff4f00;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .label {
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-size: 10px;
        color: #6b6b74;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Capacitor requires a webDir with an index.html. This is only the brief
      splash shown before the hosted WebView loads portalvoltairstudio.vercel.app
      (see capacitor.config.ts → server.url), and the fallback if the device is
      offline on a cold start before the service worker cache is warm.
    -->
    <div class="wrap">
      <div class="dot"></div>
      <div class="label">Voltair Studio</div>
    </div>
  </body>
</html>
